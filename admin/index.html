<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="refresh" content="1;url=https://printflow-bcjh.vercel.app/login">
<title>Advanced Staff Login</title>
<style>
:root{--navy:#0b2038;--red:#d83d49;--paper:#f5f6f4;--ink:#17202a;--muted:#5e6875}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;background:var(--paper);font-family:Inter,Arial,sans-serif;color:var(--ink)}
.card{width:min(620px,100%);background:#fff;border:1px solid #dce2e7;border-radius:22px;padding:36px;box-shadow:0 22px 70px rgba(8,28,48,.12)}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--red)}
h1{margin:.5rem 0 1rem;color:var(--navy);font-size:clamp(32px,5vw,50px);line-height:1.02}
p{color:var(--muted);line-height:1.6}
a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 20px;border-radius:999px;background:var(--navy);color:#fff;text-decoration:none;font-weight:800}
</style>
</head>
<body>
<main class="card">
  <div class="eyebrow">ADVANCED STAFF</div>
  <h1>Opening PrintFlow.</h1>
  <p>Advanced Embroidery's orders, products, pricing, SanMar connection, Square connection and production workflow are managed in PrintFlow.</p>
  <p><a href="https://printflow-bcjh.vercel.app/login">Open PrintFlow Login</a></p>
</main>
<script>
setTimeout(function(){ window.location.replace("https://printflow-bcjh.vercel.app/login"); }, 350);
</script>
</body>
</html>
